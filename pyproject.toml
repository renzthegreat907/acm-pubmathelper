[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "acm-pubmathelper"
version = "0.1.0"
description = "Organization-specific MCP tools for pubmat creation"
requires-python = ">=3.12"

[project.scripts]
pubmat-helper = "pubmat_helper.cli:main"

[tool.poetry]
packages = [{ include = "pubmat_helper" }]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp = "^2.3.0"
MCP-remove-background = { git = "https://github.com/adamryczkowski/MCP-remove-background.git" }
httpx = "^0.28.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
reportMissingTypeStubs = "none"